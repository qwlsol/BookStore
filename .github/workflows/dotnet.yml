# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore ./BookStore/BookStore.csproj
    
    - name: Restore test dependencies
      run: dotnet restore ./BookStoreTest/BookStoreTest.csproj
    
    - name: Build main project
      run: dotnet build ./BookStore/BookStore.csproj --configuration Release --no-restore
    
    - name: Build tests
      run: dotnet build ./BookStoreTest/BookStoreTest.csproj --configuration Release --no-restore
    
    - name: Run tests
      run: dotnet test ./BookStoreTest/BookStoreTest.csproj --configuration Release --no-build --verbosity normal
